[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-signal"
version = "0.1.0"
description = "Multi-timeframe deep-learning buy/sell signals for XAUUSD gold."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3",
  "torch>=2.2",
  "pandas>=2.1",
  "numpy>=1.26",
  "pyarrow>=15.0",
  "scikit-learn>=1.4",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pymongo>=4.6",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
smart-signal = "smart_signal.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
